services:
  postgres:
    image: postgres:16-alpine
    container_name: aives-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aives
      POSTGRES_PASSWORD: aives
      POSTGRES_DB: aives
    ports:
      - "5433:5432"
    volumes:
      - aives_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aives -d aives"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aives_pgdata:
