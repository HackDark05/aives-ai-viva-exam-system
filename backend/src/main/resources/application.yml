server:
  port: ${PORT:4000}

spring:
  application:
    name: aives-api
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://localhost:5433/aives
    username: aives
    password: aives

app:
  jwt-secret: ${JWT_SECRET:change-me}
  jwt-ttl: 7d
  frontend-url: ${FRONTEND_URL:http://localhost:3001}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  documents-dir: ${DOCUMENTS_DIR:data/documents}
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
